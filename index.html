<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineCore</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white">

<div class="max-w-4xl mx-auto p-4">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <h1 class="text-xl font-bold">MineCore</h1>
  <div class="text-sm">Balance: ₦<span id="balance">0</span></div>
</div>

<!-- AUTH -->
<div id="auth" class="space-y-3">
  <input id="email" placeholder="Email" class="w-full p-3 bg-slate-800 rounded">
  <input id="password" type="password" placeholder="Password" class="w-full p-3 bg-slate-800 rounded">
  <button onclick="login()" class="w-full bg-emerald-500 p-3 rounded">Login</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">

<div class="flex gap-2 mb-4">
  <input id="bet" type="number" value="5000" class="p-2 bg-slate-800 rounded w-full">
  <button onclick="startGame()" class="bg-blue-500 px-4 rounded">Start</button>
</div>

<div id="grid" class="grid grid-cols-4 gap-2"></div>

<button onclick="cashOut()" class="mt-4 w-full bg-green-500 p-3 rounded">Cash Out</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
